<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── Helpers ────────────────────────────────────────────────────────────────

function detectCategory(name) {
  const n = name.toLowerCase();
  if (/trouser|pant|jean|skirt|short|legging|chino|jogger|hose|rock/.test(n)) return 'bottom';
  if (/dress|jumpsuit|overall|romper|gown|kleid/.test(n)) return 'dress';
  return 'top';
}

function categoryLabel(cat) {
  if (cat === 'bottom') return '👖 Pants/Skirt';
  if (cat === 'dress') return '👗 Dress/Jumpsuit';
  return '👕 Top/Jacket';
}

function CategoryPill({ category }) {
  const cls = category === 'bottom' ? 'pill-bottom' : category === 'dress' ? 'pill-dress' : 'pill-top';
  return <span className={`pill ${cls}`}>{categoryLabel(category)}</span>;
}

const SIZE_ORDER = ['XS','S','M','L','XL','XXL','XXXL'];

function sizeIndex(s) { return SIZE_ORDER.indexOf(s); }

function recommendSize(profile) {
  const { gender, chest, waist, arm } = profile || {};
  const sizes = [];
  const isFemale = gender === 'female';

  if (chest) {
    const v = parseFloat(chest);
    if (!isNaN(v)) {
      const thresholds = isFemale
        ? [82,87,92,97,102,107]
        : [88,93,98,103,108,113];
      const sz = thresholds.findIndex(t => v <= t);
      sizes.push(sz === -1 ? 6 : sz);
    }
  }
  if (waist) {
    const v = parseFloat(waist);
    if (!isNaN(v)) {
      const thresholds = isFemale
        ? [63,68,73,78,83,88]
        : [73,78,83,88,93,98];
      const sz = thresholds.findIndex(t => v <= t);
      sizes.push(sz === -1 ? 6 : sz);
    }
  }
  if (arm) {
    const v = parseFloat(arm);
    if (!isNaN(v)) {
      const thresholds = [57,59,61,63,65,67];
      const sz = thresholds.findIndex(t => v <= t);
      sizes.push(sz === -1 ? 6 : sz);
    }
  }
  if (sizes.length === 0) return { size: 'M', confidence: 'none', breakdown: [] };

  const avg = sizes.reduce((a,b) => a+b, 0) / sizes.length;
  const rounded = Math.round(avg);
  const size = SIZE_ORDER[Math.min(rounded, 6)];
  const spread = Math.max(...sizes) - Math.min(...sizes);
  const confidence = spread <= 1 ? 'high' : spread <= 2 ? 'medium' : 'low';

  const breakdown = [];
  if (chest && !isNaN(parseFloat(chest))) breakdown.push({ label: 'Chest', value: chest + ' cm', size: SIZE_ORDER[Math.min(sizes[breakdown.length] ?? rounded, 6)] });
  if (waist && !isNaN(parseFloat(waist))) {
    const idx = chest && !isNaN(parseFloat(chest)) ? 1 : 0;
    breakdown.push({ label: 'Waist', value: waist + ' cm', size: SIZE_ORDER[Math.min(sizes[idx] ?? rounded, 6)] });
  }
  if (arm && !isNaN(parseFloat(arm))) {
    breakdown.push({ label: 'Arm Length', value: arm + ' cm', size: SIZE_ORDER[Math.min(sizes[sizes.length-1] ?? rounded, 6)] });
  }
  return { size, confidence, breakdown };
}

function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function safeLocalGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function safeLocalSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ─── Gradient Placeholder ────────────────────────────────────────────────────

function GradientPlaceholder({ category, size = 'full', label }) {
  const gradient = category === 'bottom'
    ? 'linear-gradient(135deg, #1e3a5f 0%, #1a2d4a 100%)'
    : category === 'dress'
    ? 'linear-gradient(135deg, #3b1a5f 0%, #2d1a4a 100%)'
    : 'linear-gradient(135deg, #5f2d1a 0%, #4a1f0e 100%)';
  const emoji = category === 'bottom' ? '👖' : category === 'dress' ? '👗' : '👕';
  return (
    <div style={{
      background: gradient,
      borderRadius: 10,
      display: 'flex',
      flexDirection: 'column',
      alignItems: 'center',
      justifyContent: 'center',
      width: '100%',
      height: size === 'sm' ? 80 : size === 'md' ? 120 : 160,
      gap: 6,
    }}>
      <span style={{ fontSize: size === 'sm' ? 24 : 36 }}>{emoji}</span>
      {label && <span style={{ color: '#94A3B8', fontSize: 11 }}>{label}</span>}
    </div>
  );
}

// ─── Landing View ────────────────────────────────────────────────────────────

        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 32, height: 32, background: 'linear-gradient(135deg,#F97316,#FB923C)', borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>⚡</div>
          <span style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 22, letterSpacing: '0.08em', color: '#F8FAFC' }}>FIT-ME</span>
        </div>
        <button className="btn-primary" onClick={onOpenDashboard} style={{ padding: '9px 22px', borderRadius: 10, fontSize: 14 }}>
          Open Dashboard
        </button>
      </nav>

      {/* Hero */}
      <div style={{ paddingTop: 64 }}>
        <div style={{ maxWidth: 900, margin: '0 auto', padding: '80px 24px 60px', textAlign: 'center' }}>
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'rgba(249,115,22,0.12)', border: '1px solid rgba(249,115,22,0.25)', borderRadius: 999, padding: '5px 16px', marginBottom: 28 }}>
            <span style={{ width: 7, height: 7, background: '#22C55E', borderRadius: '50%', display: 'inline-block' }}></span>
            <span style={{ color: '#F97316', fontSize: 13, fontWeight: 600, fontFamily: 'Barlow Condensed', letterSpacing: '0.05em' }}>AI-POWERED FITNESS + VIRTUAL TRY-ON</span>

          <h1 style={{ fontFamily: 'Barlow Condensed', fontWeight: 800, fontSize: 'clamp(48px,9vw,96px)', lineHeight: 0.95, color: '#F8FAFC', margin: '0 0 24px', letterSpacing: '-0.01em' }}>

            <span style={{ background: 'linear-gradient(90deg, #F97316, #FB923C)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' }}>LIVE BETTER</span>

          <button className="btn-success glow-pulse" onClick={onOpenDashboard} style={{ padding: '16px 40px', borderRadius: 14, fontSize: 18, display: 'inline-flex', alignItems: 'center', gap: 8 }}>
            Open Dashboard →
          </button>

          {/* Stats */}
          <div style={{ display: 'flex', justifyContent: 'center', gap: 40, marginTop: 56, flexWrap: 'wrap' }}>
            {[
              { label: 'Active Users', value: '500K+' },
              { label: 'App Rating', value: '4.9★' },
              { label: 'Platforms', value: 'iOS & Android' },
            ].map(s => (
              <div key={s.label} style={{ textAlign: 'center' }}>
                <div style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 28, color: '#F97316' }}>{s.value}</div>

        <div style={{ maxWidth: 1100, margin: '0 auto', padding: '0 24px 80px' }}>
          <h2 style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 36, textAlign: 'center', marginBottom: 40, color: '#F8FAFC', letterSpacing: '0.02em' }}>EVERYTHING YOU NEED</h2>

            {features.map(f => (

                <div style={{ fontSize: 32, marginBottom: 14 }}>{f.icon}</div>

            ))}

        </div>
      </div>

      {/* Footer */}
      <div style={{ borderTop: '1px solid rgba(249,115,22,0.1)', padding: '24px', textAlign: 'center' }}>

          <span style={{ fontSize: 16 }}>⚡</span>
          <span style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 18, color: '#F8FAFC' }}>FIT-ME</span>

// ─── Overview Tab ────────────────────────────────────────────────────────────

function OverviewTab() {

    { label: 'Active Minutes', value: '94', unit: 'min', color: '#22C55E', icon: '⏱' },

              <div style={{ color: '#F97316', fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 16 }}>{w.cal}</div>
              <div style={{ color: '#64748B', fontSize: 11 }}>kcal</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Try On Tab ──────────────────────────────────────────────────────────────

function TryOnTab({ photos, profile, onSaveToHistory, onGoToProfile }) {
  const [itemName, setItemName] = useState('');
  const [brand, setBrand] = useState('');
  const [imageUrl, setImageUrl] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  const category = itemName.trim() ? detectCategory(itemName) : null;
  const hasFront = !!(photos && photos.front);
  const hasName = itemName.trim().length > 0;
  const canGenerate = hasFront && hasName;

  const { size } = profile && (profile.chest || profile.waist || profile.arm)
    ? recommendSize(profile)
    : { size: 'M' };

  function handleGenerate() {
    if (!canGenerate) return;
    setLoading(true);
    setTimeout(() => {
      const entry = {
        id: uid(),
        itemName: itemName.trim(),
        brand: brand.trim(),
        itemImageUrl: imageUrl.trim(),
        category: detectCategory(itemName),
        sizeRecommended: size,
        createdAt: new Date().toISOString(),
      };
      setResult(entry);
      onSaveToHistory(entry);
      setLoading(false);
    }, 900);
  }

  function handleReset() {
    setResult(null);
    setItemName('');
    setBrand('');
    setImageUrl('');
  }

  return (
    <div className="fade-in">
      <h2 style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 28, marginBottom: 24, color: '#F8FAFC', letterSpacing: '0.02em' }}>VIRTUAL TRY-ON</h2>

      {!hasFront && (
        <div style={{ background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)', borderRadius: 14, padding: '18px 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12, marginBottom: 24 }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
            <span style={{ fontSize: 20, flexShrink: 0 }}>⚠️</span>
            <div>
              <div style={{ color: '#f87171', fontWeight: 600, fontSize: 14 }}>No front photo found</div>
              <div style={{ color: '#94A3B8', fontSize: 13, marginTop: 2 }}>Please upload a full-body photo in the Profile tab first.</div>
            </div>
          </div>
          <button className="btn-primary" onClick={onGoToProfile} style={{ padding: '9px 18px', borderRadius: 10, fontSize: 13, flexShrink: 0 }}>Go to Profile</button>
        </div>
      )}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(320px,1fr))', gap: 24 }}>
        {/* Input form */}
        <div className="glass" style={{ padding: 24 }}>
          <div style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 17, color: '#F8FAFC', marginBottom: 20 }}>ITEM DETAILS</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <div>
              <label>Item Name *</label>
              <input value={itemName} onChange={e => setItemName(e.target.value)} placeholder="e.g. Slim Fit Jeans, Oxford Shirt…" />
              {category && (
                <div style={{ marginTop: 8 }}>
                  <CategoryPill category={category} />
                </div>
              )}
            </div>
            <div>
              <label>Brand</label>
              <input value={brand} onChange={e => setBrand(e.target.value)} placeholder="e.g. Zara, H&M, Nike…" />
            </div>
            <div>
              <label>Image URL (optional)</label>
              <input value={imageUrl} onChange={e => setImageUrl(e.target.value)} placeholder="https://example.com/item.jpg" />
            </div>

            {hasFront && (
              <div>
                <label style={{ marginBottom: 8 }}>Your photo (front)</label>
                <div style={{ borderRadius: 10, overflow: 'hidden', border: '1px solid rgba(249,115,22,0.2)' }}>
                  <img src={photos.front} alt="Front" style={{ width: '100%', maxHeight: 140, objectFit: 'cover', display: 'block' }} />
                </div>
              </div>
            )}

            <button

              onClick={handleGenerate}
              disabled={!canGenerate || loading}
              style={{
                padding: '13px 0',
                borderRadius: 12,
                fontSize: 15,
                marginTop: 4,
                opacity: (!canGenerate || loading) ? 0.5 : 1,
                cursor: (!canGenerate || loading) ? 'not-allowed' : 'pointer',
              }}
            >
              {loading ? '⏳ Generating…' : '✨ Generate Try-On'}
            </button>
          </div>
        </div>

        {/* Result */}
        {result && (
          <div className="glass fade-in" style={{ padding: 24 }}>
            <div style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 17, color: '#F8FAFC', marginBottom: 20 }}>TRY-ON RESULT</div>
            <div style={{ borderRadius: 12, overflow: 'hidden', marginBottom: 16 }}>
              {result.itemImageUrl ? (
                <img src={result.itemImageUrl} alt={result.itemName} style={{ width: '100%', maxHeight: 200, objectFit: 'cover', display: 'block' }} onError={e => e.target.style.display='none'} />

                <GradientPlaceholder category={result.category} />
              )}
            </div>
            <div style={{ fontWeight: 600, fontSize: 16, color: '#F8FAFC', marginBottom: 6 }}>{result.itemName}</div>
            {result.brand && <div style={{ color: '#94A3B8', fontSize: 13, marginBottom: 12 }}>{result.brand}</div>}
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 16 }}>
              <CategoryPill category={result.category} />

function WardrobeTab({ wardrobe, setWardrobe }) {

    const item = { id: uid(), name: name.trim(), brand: brand.trim(), imageUrl: imageUrl.trim(), category: detectCategory(name), price: price.trim(), addedAt: new Date().toISOString() };
    setWardrobe(prev => [item, ...prev]);

              <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. White Linen Shirt" required />

            <div>
              <label>Brand</label>
              <input value={brand} onChange={e => setBrand(e.target.value)} placeholder="e.g. Zara" />
            </div>
            <div>
              <label>Image URL</label>
              <input value={imageUrl} onChange={e => setImageUrl(e.target.value)} placeholder="https://…" />

            <div>
              <label>Price (optional)</label>

            style={{ background: filter === f.key ? 'rgba(249,115,22,0.15)' : 'transparent' }}>
            {f.label} {filter === f.key || f.key === 'all' ? `(${f.key === 'all' ? wardrobe.length : wardrobe.filter(i => i.category === f.key).length})` : ''}

  );

        </div>
      )}
    </div>
  );
}

function ProfileTab({ profile, setProfile, photos, setPhotos }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(profile);

  useEffect(() => { setDraft(profile); }, [profile]);

  const frontRef = useRef();
  const sideRef = useRef();
  const backRef = useRef();

  function handlePhotoUpload(slot, e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setPhotos(prev => ({ ...prev, [slot]: ev.target.result }));
    reader.readAsDataURL(file);
  }

  function removePhoto(slot) {
    setPhotos(prev => ({ ...prev, [slot]: null }));
  }

  function handleSave() {
    setProfile(draft);
    setEditing(false);
  }

  const measurements = [
    { key: 'height', label: 'Height', unit: 'cm' },
    { key: 'chest', label: 'Chest', unit: 'cm' },
    { key: 'waist', label: 'Waist', unit: 'cm' },
    { key: 'hips', label: 'Hips', unit: 'cm' },
    { key: 'inseam', label: 'Inseam', unit: 'cm' },
    { key: 'arm', label: 'Arm Length', unit: 'cm' },
  ];

  const hasMeasurements = measurements.some(m => profile[m.key] && !isNaN(parseFloat(profile[m.key])));
  const sizeResult = hasMeasurements ? recommendSize(profile) : null;

  const confidenceColor = { high: '#22C55E', medium: '#F97316', low: '#f87171' };

  const photoSlots = [
    { key: 'front', label: 'Front', badge: '📸 Used for Try-On', ref: frontRef },

    { key: 'back', label: 'Back', ref: backRef },

    <div className="fade-in">
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24, flexWrap: 'wrap', gap: 12 }}>

          <div className="glass" style={{ padding: 24 }}>
            <div style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 17, color: '#F8FAFC', marginBottom: 6 }}>BODY PHOTOS</div>
            <div style={{ color: '#64748B', fontSize: 13, marginBottom: 16 }}>Used for virtual try-on. Photos stay on your device.</div>

            {!photos.front && (
              <div style={{ background: 'rgba(249,115,22,0.08)', border: '1px solid rgba(249,115,22,0.25)', borderRadius: 12, padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
                <span style={{ fontSize: 18 }}>📸</span>
                <span style={{ color: '#F97316', fontSize: 13, fontWeight: 500 }}>Upload a front photo to enable Try-On</span>
              </div>
            )}

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12 }}>
              {photoSlots.map(slot => (
                <div key={slot.key} style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  <div
                    className="photo-slot"
                    onClick={() => !photos[slot.key] && slot.ref.current.click()}
                    style={{ cursor: photos[slot.key] ? 'default' : 'pointer' }}
                  >
                    {photos[slot.key] ? (
                      <>
                        <img src={photos[slot.key]} alt={slot.label} />
                        <button className="overlay-delete" onClick={e => { e.stopPropagation(); removePhoto(slot.key); }}>×</button>
                      </>
                    ) : (
                      <>
                        <span style={{ fontSize: 28, color: '#64748B' }}>+</span>
                        <span style={{ color: '#64748B', fontSize: 12, marginTop: 4 }}>Upload</span>
                      </>
                    )}
                  </div>
                  <input ref={slot.ref} type="file" accept="image/*" style={{ display: 'none' }} onChange={e => handlePhotoUpload(slot.key, e)} />
                  <div style={{ textAlign: 'center' }}>
                    <div style={{ color: '#94A3B8', fontSize: 13, fontWeight: 600 }}>{slot.label}</div>
                    {slot.badge && (
                      <span className="pill" style={{ background: 'rgba(249,115,22,0.12)', color: '#F97316', border: '1px solid rgba(249,115,22,0.25)', fontSize: 10, marginTop: 4, display: 'inline-flex' }}>
                        {slot.badge}
                      </span>
                    )}
                  </div>
                  {photos[slot.key] && !editing && (
                    <button className="btn-ghost" onClick={() => slot.ref.current.click()} style={{ padding: '6px 0', borderRadius: 8, fontSize: 12, textAlign: 'center' }}>
                      Change
                    </button>
                  )}
                  {photos[slot.key] && <input ref={slot.ref} type="file" accept="image/*" style={{ display: 'none' }} onChange={e => handlePhotoUpload(slot.key, e)} />}
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid rgba(249,115,22,0.08)', paddingBottom: 10 }}>
      <span style={{ color: '#64748B', fontSize: 13 }}>{label}</span>
      <span style={{ color: '#F8FAFC', fontWeight: 500, fontSize: 14 }}>{value}</span>
    </div>
  );
}

// ─── Dashboard View ──────────────────────────────────────────────────────────

function DashboardView({ onGoLanding, profile, setProfile, photos, setPhotos, wardrobe, setWardrobe, history, setHistory }) {
  const [activeTab, setActiveTab] = useState('overview');
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const navItems = [
    { key: 'overview', emoji: '🏠', label: 'Overview' },
    { key: 'tryon', emoji: '👕', label: 'Try On' },
    { key: 'wardrobe', emoji: '👗', label: 'Wardrobe' },
    { key: 'history', emoji: '🕐', label: 'History' },
    { key: 'profile', emoji: '👤', label: 'Profile' },
  ];

  function navigate(key) {
    setActiveTab(key);
    setSidebarOpen(false);
  }

  function saveToHistory(entry) {
    setHistory(prev => [entry, ...prev]);
  }

  const SIDEBAR_WIDTH = 220;

  return (
    <div style={{ minHeight: '100vh', background: '#0F1117', display: 'flex', flexDirection: 'column' }}>
      {/* Top bar */}
      <div className="glass-navbar" style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 200, height: 60, display: 'flex', alignItems: 'center', paddingLeft: 16, paddingRight: 16, gap: 12 }}>
        <button
          onClick={() => setSidebarOpen(o => !o)}
          style={{ display: 'none', background: 'transparent', border: 'none', cursor: 'pointer', color: '#94A3B8', fontSize: 22, padding: 4, lineHeight: 1 }}
          className="hamburger"
        >☰</button>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ width: 28, height: 28, background: 'linear-gradient(135deg,#F97316,#FB923C)', borderRadius: 7, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14 }}>⚡</div>
          <span style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 20, letterSpacing: '0.08em', color: '#F8FAFC' }}>FIT-ME</span>
        </div>
        <div style={{ flex: 1 }} />
        <button className="btn-ghost" onClick={onGoLanding} style={{ padding: '7px 16px', borderRadius: 9, fontSize: 13 }}>← Home</button>
      </div>

      <style>{`
        @media (max-width: 767px) {
          .hamburger { display: flex !important; }
          .desktop-sidebar { display: none !important; }
          .main-shifted { margin-left: 0 !important; }
        }
      `}</style>

      {/* Mobile sidebar backdrop */}
      {sidebarOpen && (
        <div onClick={() => setSidebarOpen(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', zIndex: 299, backdropFilter: 'blur(2px)' }} />
      )}

      {/* Sidebar */}
      <div
        className="desktop-sidebar"
        style={{
          position: 'fixed',
          top: 60,
          left: sidebarOpen ? 0 : undefined,
          bottom: 0,
          width: SIDEBAR_WIDTH,
          background: 'rgba(15,17,23,0.95)',
          borderRight: '1px solid rgba(249,115,22,0.12)',
          padding: '20px 12px',
          zIndex: 300,
          overflowY: 'auto',
          display: 'flex',
          flexDirection: 'column',
          gap: 4,
          // mobile override via inline
        }}
      >
        <div style={{ fontFamily: 'Barlow Condensed', fontWeight: 700, fontSize: 11, color: '#64748B', letterSpacing: '0.12em', padding: '4px 8px', marginBottom: 8 }}>NAVIGATION</div>
        {navItems.map(item => (
          <div
            key={item.key}
            className={`sidebar-item${activeTab === item.key ? ' active' : ''}`}
            onClick={() => navigate(item.key)}
          >
            <span style={{ fontSize: 18 }}>{item.emoji}</span>
            <span>{item.label}</span>
            {item.key === 'history' && history.length > 0 && (
              <span style={{ marginLeft: 'auto', background: 'rgba(249,115,22,0.2)', color: '#F97316', borderRadius: 999, padding: '1px 7px', fontSize: 11, fontWeight: 700 }}>{history.length}</span>
            )}
            {item.key === 'wardrobe' && wardrobe.length > 0 && (
              <span style={{ marginLeft: 'auto', background: 'rgba(249,115,22,0.2)', color: '#F97316', borderRadius: 999, padding: '1px 7px', fontSize: 11, fontWeight: 700 }}>{wardrobe.length}</span>
            )}
          </div>
        ))}
      </div>

      {/* Mobile sidebar (overlay) */}
      <div style={{
        position: 'fixed',
        top: 60,
        left: sidebarOpen ? 0 : -SIDEBAR_WIDTH,
        bottom: 0,
        width: SIDEBAR_WIDTH,
        background: 'rgba(15,17,23,0.98)',
        borderRight: '1px solid rgba(249,115,22,0.15)',
        padding: '20px 12px',
        zIndex: 300,
        overflowY: 'auto',
        display: 'none',
        flexDirection: 'column',
        gap: 4,
        transition: 'left 0.25s ease',
      }} className="mobile-sidebar">
        {navItems.map(item => (
          <div key={item.key} className={`sidebar-item${activeTab === item.key ? ' active' : ''}`} onClick={() => navigate(item.key)}>
            <span style={{ fontSize: 18 }}>{item.emoji}</span>
            <span>{item.label}</span>
          </div>
        ))}
      </div>

      <style>{`
        @media (max-width: 767px) {
          .mobile-sidebar { display: flex !important; }
        }
      `}</style>

      {/* Main content */}
      <div className="main-shifted" style={{ marginLeft: SIDEBAR_WIDTH, marginTop: 60, padding: '32px 28px', minHeight: 'calc(100vh - 60px)', maxWidth: 'calc(100vw - 220px)' }}>
        <style>{`@media(max-width:767px){ .main-shifted { margin-left:0 !important; max-width:100vw !important; padding:24px 16px !important; } }`}</style>
        {activeTab === 'overview' && <OverviewTab />}
        {activeTab === 'tryon' && <TryOnTab photos={photos} profile={profile} onSaveToHistory={saveToHistory} onGoToProfile={() => navigate('profile')} />}
        {activeTab === 'wardrobe' && <WardrobeTab wardrobe={wardrobe} setWardrobe={setWardrobe} />}
        {activeTab === 'history' && <HistoryTab history={history} setHistory={setHistory} />}
        {activeTab === 'profile' && <ProfileTab profile={profile} setProfile={setProfile} photos={photos} setPhotos={setPhotos} />}
      </div>
    </div>
  );
}

// ─── Root App ────────────────────────────────────────────────────────────────

function App() {
  const [view, setView] = useState('landing');

  const [profile, setProfileState] = useState(() => safeLocalGet('fitme_profile', {
    name: '', gender: '', preferredSize: '', height: '', chest: '', waist: '', hips: '', inseam: '', arm: ''
  }));
  const [photos, setPhotosState] = useState(() => safeLocalGet('fitme_photos', { front: null, side: null, back: null }));
  const [wardrobe, setWardrobeState] = useState(() => safeLocalGet('fitme_wardrobe', []));
  const [history, setHistoryState] = useState(() => safeLocalGet('fitme_history', []));

  function setProfile(v) {
    const val = typeof v === 'function' ? v(profile) : v;
    setProfileState(val);
    safeLocalSet('fitme_profile', val);
  }
  function setPhotos(v) {
    const val = typeof v === 'function' ? v(photos) : v;
    setPhotosState(val);
    safeLocalSet('fitme_photos', val);
  }
  function setWardrobe(v) {
    const val = typeof v === 'function' ? v(wardrobe) : v;
    setWardrobeState(val);
    safeLocalSet('fitme_wardrobe', val);
  }
  function setHistory(v) {
    const val = typeof v === 'function' ? v(history) : v;
    setHistoryState(val);
    safeLocalSet('fitme_history', val);
  }

  if (view === 'landing') {
    return <LandingView onOpenDashboard={() => setView('dashboard')} />;
  }
  return (
    <DashboardView
      onGoLanding={() => setView('landing')}
      profile={profile}
      setProfile={setProfile}
      photos={photos}
      setPhotos={setPhotos}
      wardrobe={wardrobe}
      setWardrobe={setWardrobe}
      history={history}
      setHistory={setHistory}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
