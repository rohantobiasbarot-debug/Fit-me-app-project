<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Helpers ──────────────────────────────────────────────────────────────────

function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function detectCategory(name) {
  const n = name.toLowerCase();
  if (/trouser|pant|jean|skirt|short|legging|chino|jogger|hose|rock/.test(n)) return 'lower_body';
  if (/dress|jumpsuit|overall|romper|gown|kleid/.test(n)) return 'dresses';
  return 'tops';
}

function categoryLabel(cat) {
  if (cat === 'lower_body') return '👖 Bottoms';
  if (cat === 'dresses') return '👗 Dress/Jumpsuit';
  return '👕 Top / Jacket';
}

function sizeVote(measurement, type, gender) {
  const v = parseFloat(measurement);
  if (isNaN(v)) return null;
  const sizes = ['XS','S','M','L','XL','XXL','XXXL'];
  let thresholds;
  if (type === 'chest') {
    thresholds = gender === 'female' ? [80,85,90,95,100,105] : [88,93,98,103,108,113];
  } else if (type === 'waist') {
    thresholds = gender === 'female' ? [62,67,72,77,82,87] : [73,78,83,88,93,98];
  } else if (type === 'hips') {
    thresholds = [88,93,98,103,108,113];
  } else if (type === 'arm') {
    thresholds = [57,59,61,63,65,67];
  } else {
    return null;
  }
  for (let i = 0; i < thresholds.length; i++) {
    if (v <= thresholds[i]) return sizes[i];
  }
  return 'XXXL';
}

const SIZE_ORDER = ['XS','S','M','L','XL','XXL','XXXL'];

function sizeToNum(s) { return SIZE_ORDER.indexOf(s); }

function calcSizeRecommendation(profile) {
  const gender = profile.gender === 'female' ? 'female' : 'male';
  const votes = [];
  const rows = [];
  const fields = [
    { key: 'chest', label: 'Chest' },
    { key: 'waist', label: 'Waist' },
    { key: 'hips', label: 'Hips' },
    { key: 'arm', label: 'Arm' },
  ];
  for (const f of fields) {
    const v = sizeVote(profile[f.key], f.key, gender);
    if (v) {
      votes.push(v);
      rows.push({ label: `${f.label} (cm)`, value: profile[f.key], vote: v });
    }
  }
  if (votes.length === 0) return null;
  const nums = votes.map(sizeToNum);
  const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
  const rounded = Math.round(avg);
  const rec = SIZE_ORDER[Math.max(0, Math.min(6, rounded))];
  const spread = Math.max(...nums) - Math.min(...nums);
  let confidence, confColor, note;
  if (spread <= 1) {
    confidence = 'High confidence';
    confColor = '#22C55E';
    note = 'All measurements agree — great fit expected.';
  } else if (spread <= 2) {
    confidence = 'Medium confidence';
    confColor = '#EAB308';
    note = 'Measurements vary slightly — consider sizing up.';
  } else {
    confidence = 'Low confidence';
    confColor = '#EF4444';
    note = 'Measurements vary widely — try different sizes.';
  }
  return { rec, confidence, confColor, note, rows };
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function useLocalStorage(key, init) {
  const [state, setState] = useState(init);
  useEffect(() => {
    try {
      const raw = localStorage.getItem(key);
      if (raw !== null) setState(JSON.parse(raw));
    } catch {}
  }, [key]);
  const set = useCallback((val) => {
    setState(prev => {
      const next = typeof val === 'function' ? val(prev) : val;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [state, set];
}

// ── Design tokens ─────────────────────────────────────────────────────────────

const PINK = '#FF2D6F';
const CARD_BG = '#1A1A1A';
const BORDER = '#2A2A2A';

// ── Small shared components ────────────────────────────────────────────────────

function Badge({ children, style }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      background: 'rgba(255,45,111,0.15)', color: PINK,
      borderRadius: 999, padding: '3px 10px', fontSize: 12, fontWeight: 600,
      ...style
    }}>{children}</span>
  );
}

function SizeBadge({ size }) {
  return (
    <span style={{
      border: `1px solid ${PINK}`, color: PINK,
      borderRadius: 999, padding: '3px 10px', fontSize: 12, fontWeight: 700,
    }}>{size}</span>
  );
}

function ClothingImage({ url, size }) {
  const [err, setErr] = useState(false);
  const sz = size || 80;
  if (!url || err) {
    return (
      <div className="clothing-placeholder" style={{ width: sz, height: sz, borderRadius: 8, flexShrink: 0 }}>
        👗
      </div>
    );
  }
  return (
    <img src={url} alt="" onError={() => setErr(true)}
      style={{ width: sz, height: sz, objectFit: 'cover', borderRadius: 8, flexShrink: 0 }} />
  );
}

        <div style={{ display: 'flex', gap: 24, justifyContent: 'center', marginTop: 72, flexWrap: 'wrap' }}>
          {[
            { icon: '📸', title: 'Upload Photo', desc: 'Share your full-body photo' },
            { icon: '👗', title: 'Browse Styles', desc: 'Explore thousands of garments' },

// ── Try On Tab ─────────────────────────────────────────────────────────────────

function TryOnTab({ profile, photos, setHistory, prefill, clearPrefill, goToProfile }) {
  const [itemName, setItemName] = useState('');
  const [brand, setBrand] = useState('');
  const [imageUrl, setImageUrl] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const appliedPrefill = useRef(null);

  useEffect(() => {
    if (prefill && prefill !== appliedPrefill.current) {
      appliedPrefill.current = prefill;
      setItemName(prefill.name || '');
      setBrand(prefill.brand || '');
      setImageUrl(prefill.imageUrl || '');
      setResult(null);
      clearPrefill();
    }
  }, [prefill, clearPrefill]);

  const category = detectCategory(itemName);
  const hasFront = !!(photos && photos.front);
  const sizeRec = calcSizeRecommendation(profile || {});
  const canGenerate = itemName.trim().length > 0 && hasFront;

  function generate() {
    if (!canGenerate) return;
    setLoading(true);
    setResult(null);
    setTimeout(() => {
      const rec = sizeRec ? sizeRec.rec : (profile && profile.preferredSize ? profile.preferredSize : 'M');
      const entry = {
        id: uid(),
        itemName: itemName.trim(),
        brand: brand.trim(),
        itemImageUrl: imageUrl.trim(),
        category,
        sizeRecommended: rec,
        createdAt: new Date().toISOString(),
      };
      setHistory(h => [entry, ...h]);
      setResult({ ...entry });
      setLoading(false);
    }, 1500);
  }

  return (
    <div>
      <div style={{ marginBottom: 28 }}>
        <h1 style={{ fontSize: 24, fontWeight: 700 }}>Virtual Try-On</h1>
        <p style={{ color: '#888888', marginTop: 4 }}>See how clothes look on you</p>
      </div>

      {/* Item Input */}
      <div className="card" style={{ marginBottom: 20 }}>
        <div style={{ fontWeight: 600, marginBottom: 16 }}>Clothing Item</div>
        <div style={{ display: 'grid', gap: 12 }}>
          <div>
            <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Item Name</label>
            <input value={itemName} onChange={e => { setItemName(e.target.value); setResult(null); }}
              placeholder="e.g. Nike Air Force 1 Jacket" />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <div>
              <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Brand</label>
              <input value={brand} onChange={e => setBrand(e.target.value)} placeholder="e.g. Nike" />
            </div>
            <div>
              <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Image URL</label>
              <input value={imageUrl} onChange={e => setImageUrl(e.target.value)} placeholder="https://..." />
            </div>
          </div>
          {itemName.trim() && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 13, color: '#888888' }}>Detected category:</span>
              <Badge>{categoryLabel(category)}</Badge>
            </div>
          )}
        </div>
      </div>

      {/* Your Photo */}
      <div className="card" style={{ marginBottom: 20 }}>
        <div style={{ fontWeight: 600, marginBottom: 16 }}>Your Photo</div>
        {!hasFront ? (
          <div style={{
            background: 'rgba(255,45,111,0.08)', border: `1px solid rgba(255,45,111,0.3)`,
            borderRadius: 10, padding: '16px 20px',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12,
          }}>
            <div>
              <div style={{ fontWeight: 600, marginBottom: 2 }}>📸 No photo found</div>
              <div style={{ fontSize: 13, color: '#888888' }}>Upload a full-body photo in your Profile first</div>
            </div>
            <button className="btn-pink" style={{ fontSize: 13, padding: '8px 16px', whiteSpace: 'nowrap' }}
              onClick={goToProfile}>Go to Profile →</button>
          </div>
        ) : (
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <img src={photos.front} alt="Your photo"
              style={{ width: 72, height: 96, objectFit: 'cover', borderRadius: 8 }} />
            <div>
              <div style={{ fontWeight: 500 }}>Your photo</div>
              <div style={{ fontSize: 12, color: '#888888', marginTop: 2 }}>Front view — ready for try-on</div>
            </div>
          </div>
        )}
      </div>

      {/* Generate */}
      <button className="btn-pink" style={{ width: '100%', fontSize: 15, padding: '13px' }}
        disabled={!canGenerate || loading} onClick={generate}>
        {loading
          ? <span><span className="spinner"></span>Generating...</span>
          : 'Generate Try-On ✨'}
      </button>

      {/* Result */}
      {result && (
        <div className="card" style={{ marginTop: 20 }}>
          <div style={{ fontWeight: 600, marginBottom: 16, fontSize: 16 }}>Try-On Result</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
            <div>
              <div style={{ fontSize: 12, color: '#888888', marginBottom: 8 }}>Your photo</div>
              <img src={photos.front} alt="" style={{ width: '100%', borderRadius: 10, objectFit: 'cover', maxHeight: 240 }} />
            </div>
            <div>
              <div style={{ fontSize: 12, color: '#888888', marginBottom: 8 }}>Clothing item</div>
              <ClothingImageResult url={result.itemImageUrl} />
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', marginBottom: 12 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 13, color: '#888888' }}>Recommended size:</span>
              <span style={{
                background: PINK, color: '#FFFFFF', fontWeight: 800, fontSize: 20,
                borderRadius: 999, width: 48, height: 48, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
              }}>{result.sizeRecommended}</span>
            </div>
            <Badge>{categoryLabel(result.category)}</Badge>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: '#22C55E', fontSize: 13, fontWeight: 500 }}>
            💾 Saved to History
          </div>
        </div>
      )}
    </div>
  );
}

function ClothingImageResult({ url }) {
  const [err, setErr] = useState(false);
  if (!url || err) {
    return (
      <div className="clothing-placeholder" style={{ width: '100%', height: 240, borderRadius: 10 }}>👗</div>
    );
  }
  return (
    <img src={url} alt="" onError={() => setErr(true)}
      style={{ width: '100%', borderRadius: 10, objectFit: 'cover', maxHeight: 240 }} />
  );
}

// ── Wardrobe Tab ───────────────────────────────────────────────────────────────

function WardrobeTab({ wardrobe, setWardrobe, onTryOn }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: '', brand: '', imageUrl: '', price: '' });
  const [filter, setFilter] = useState('all');

  function addItem() {
    if (!form.name.trim()) return;
    const item = {
      id: uid(),
      name: form.name.trim(),
      brand: form.brand.trim(),
      imageUrl: form.imageUrl.trim(),
      price: form.price.trim(),
      category: detectCategory(form.name),
      addedAt: new Date().toISOString(),
    };
    setWardrobe(w => [item, ...w]);
    setForm({ name: '', brand: '', imageUrl: '', price: '' });
    setShowForm(false);
  }

  function removeItem(id) {
    setWardrobe(w => w.filter(i => i.id !== id));
  }

  const filtered = wardrobe.filter(i => {
    if (filter === 'all') return true;
    if (filter === 'tops') return i.category === 'tops';
    if (filter === 'bottoms') return i.category === 'lower_body';
    if (filter === 'dresses') return i.category === 'dresses';
    return true;
  });

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24, flexWrap: 'wrap', gap: 12 }}>
        <div>
          <h1 style={{ fontSize: 24, fontWeight: 700 }}>My Wardrobe</h1>
          <p style={{ color: '#888888', marginTop: 4 }}>{wardrobe.length} item{wardrobe.length !== 1 ? 's' : ''}</p>
        </div>
        <button className="btn-pink" onClick={() => setShowForm(s => !s)}>
          {showForm ? '✕ Cancel' : '+ Add Item'}
        </button>
      </div>

      {showForm && (
        <div className="card" style={{ marginBottom: 20 }}>
          <div style={{ fontWeight: 600, marginBottom: 14 }}>New Item</div>
          <div style={{ display: 'grid', gap: 12 }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Item Name *</label>
                <input value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="e.g. Levi's 501 Jeans" />
              </div>
              <div>
                <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Brand</label>
                <input value={form.brand} onChange={e => setForm(f => ({ ...f, brand: e.target.value }))} placeholder="e.g. Levi's" />
              </div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 12 }}>
              <div>
                <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Image URL</label>
                <input value={form.imageUrl} onChange={e => setForm(f => ({ ...f, imageUrl: e.target.value }))} placeholder="https://..." />
              </div>
              <div>
                <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Price (optional)</label>
                <input value={form.price} onChange={e => setForm(f => ({ ...f, price: e.target.value }))} placeholder="€49.99" />
              </div>
            </div>
            {form.name && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 13, color: '#888888' }}>Category:</span>
                <Badge>{categoryLabel(detectCategory(form.name))}</Badge>
              </div>
            )}
            <button className="btn-pink" style={{ alignSelf: 'flex-start', padding: '10px 24px' }} onClick={addItem}>
              Add to Wardrobe
            </button>
          </div>
        </div>
      )}

      {/* Filters */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 20, flexWrap: 'wrap' }}>
        {[['all','All'],['tops','Tops'],['bottoms','Bottoms'],['dresses','Dresses']].map(([val, label]) => (
          <button key={val} className={'filter-pill' + (filter===val?' active':'')}
            onClick={() => setFilter(val)}>{label}</button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '80px 0' }}>
          <div style={{ fontSize: 64, marginBottom: 16 }}>👗</div>
          <div style={{ fontWeight: 600, fontSize: 18, marginBottom: 8 }}>
            {filter === 'all' ? 'Your wardrobe is empty' : 'No ' + filter + ' yet'}
          </div>
          <div style={{ color: '#888888', marginBottom: 24 }}>
            {filter === 'all' ? 'Add your first item to get started' : 'Try a different filter or add new items'}
          </div>
          {filter === 'all' && (
            <button className="btn-pink" onClick={() => setShowForm(true)}>Add your first item</button>
          )}
        </div>
      ) : (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: 16 }}>
          {filtered.map(item => (
            <WardrobeCard key={item.id} item={item} onRemove={removeItem} onTryOn={onTryOn} />
          ))}
        </div>
      )}
    </div>
  );
}

function WardrobeCard({ item, onRemove, onTryOn }) {

  return (
    <div className="card" style={{ padding: 0, overflow: 'hidden', position: 'relative' }}>

      setConfirmClear(true);

      return;

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24, flexWrap: 'wrap', gap: 12 }}>

          <h1 style={{ fontSize: 24, fontWeight: 700 }}>Try-On History</h1>
          <p style={{ color: '#888888', marginTop: 4 }}>{history.length} session{history.length !== 1 ? 's' : ''}</p>
        </div>
        {history.length > 0 && (

          <div style={{ fontWeight: 600, fontSize: 18, marginBottom: 8 }}>No try-ons yet</div>

      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {history.map(item => (
            <div key={item.id} className="card" style={{
              display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap',
            }}>
              <ClothingImage url={item.itemImageUrl} size={64} />
              <div style={{ flex: 1, minWidth: 140 }}>
                <div style={{ fontWeight: 600, marginBottom: 3 }}>{item.itemName}</div>
                {item.brand && <div style={{ color: '#888888', fontSize: 13 }}>{item.brand}</div>}

                  <Badge style={{ fontSize: 11 }}>{categoryLabel(item.category)}</Badge>
                  <SizeBadge size={item.sizeRecommended} />

}

// ── Profile Tab ────────────────────────────────────────────────────────────────

function ProfileTab({ profile, setProfile, photos, setPhotos }) {
  const [local, setLocal] = useState({
    name: '', gender: 'male', preferredSize: 'M',
    height: '', chest: '', waist: '', hips: '', inseam: '', arm: '',
  });
  const [saved, setSaved] = useState(false);
  const frontRef = useRef();
  const sideRef = useRef();
  const backRef = useRef();
  const fileRefs = { front: frontRef, side: sideRef, back: backRef };

  useEffect(() => {
    if (profile) {
      setLocal(prev => ({ ...prev, ...profile }));
    }
  }, [profile]);

  function update(k, v) {
    setLocal(l => ({ ...l, [k]: v }));
  }

  function save() {
    setProfile(local);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  function handlePhoto(slot, e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setPhotos(p => ({ ...p, [slot]: ev.target.result }));
    reader.readAsDataURL(file);
    e.target.value = '';
  }

  function removePhoto(slot) {
    setPhotos(p => ({ ...p, [slot]: null }));
  }

  const sizeRec = calcSizeRecommendation(local);

  return (
    <div>
      <div style={{ marginBottom: 28 }}>
        <h1 style={{ fontSize: 24, fontWeight: 700 }}>My Profile</h1>
        <p style={{ color: '#888888', marginTop: 4 }}>Measurements and photos for accurate sizing</p>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 20 }}>
        {/* Left column */}
        <div>
          <div className="card" style={{ marginBottom: 20 }}>
            <div style={{ fontWeight: 600, marginBottom: 16 }}>Identity</div>
            <div style={{ display: 'grid', gap: 12 }}>
              <div>
                <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Name</label>
                <input value={local.name} onChange={e => update('name', e.target.value)} placeholder="Your name" />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                <div>
                  <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Gender</label>
                  <select value={local.gender} onChange={e => update('gender', e.target.value)}>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div>
                  <label style={{ fontSize: 12, color: '#888888', display: 'block', marginBottom: 6 }}>Preferred Size</label>
                  <select value={local.preferredSize} onChange={e => update('preferredSize', e.target.value)}>
                    {['XS','S','M','L','XL','XXL','XXXL'].map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div className="card">
            <div style={{ fontWeight: 600, marginBottom: 4 }}>Measurements (cm)</div>
            <div style={{ color: '#555555', fontSize: 12, marginBottom: 16 }}>Used to calculate your perfect size</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}>
              {[
                { key: 'height', label: 'Height', ph: '175' },
                { key: 'chest', label: 'Chest', ph: '95' },
                { key: 'waist', label: 'Waist', ph: '80' },
                { key: 'hips', label: 'Hips', ph: '100' },
                { key: 'arm', label: 'Arm (cm)', ph: 'e.g. 60' },
                { key: 'inseam', label: 'Inseam', ph: '80' },
              ].map(f => (
                <div key={f.key}>
                  <label style={{ fontSize: 11, color: '#888888', display: 'block', marginBottom: 5 }}>{f.label}</label>
                  <input type="number" value={local[f.key]} onChange={e => update(f.key, e.target.value)} placeholder={f.ph} />
                </div>
              ))}
            </div>

            <button className="btn-pink" style={{ width: '100%', marginTop: 20 }} onClick={save}>
              {saved ? '✓ Saved!' : 'Save Profile'}
            </button>
          </div>
        </div>

        {/* Right column */}
        <div>
          <div className="card" style={{ marginBottom: 20 }}>
            <div style={{ fontWeight: 600, marginBottom: 16 }}>Your Photos</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}>
              {[
                { slot: 'front', label: 'Front', note: 'Used for Try-On 📸' },
                { slot: 'side', label: 'Side', note: 'Side view' },
                { slot: 'back', label: 'Back', note: 'Back view' },
              ].map(({ slot, label, note }) => (
                <div key={slot}>
                  <div style={{ fontSize: 11, color: '#888888', marginBottom: 6, fontWeight: 500 }}>{label}</div>
                  <input type="file" accept="image/*" ref={fileRefs[slot]}
                    style={{ display: 'none' }} onChange={e => handlePhoto(slot, e)} />
                  <div className="photo-slot"
                    onClick={() => { if (!photos || !photos[slot]) fileRefs[slot].current && fileRefs[slot].current.click(); }}>
                    {photos && photos[slot] ? (
                      <>
                        <img src={photos[slot]} alt={label} />
                        <button onClick={e => { e.stopPropagation(); removePhoto(slot); }}
                          style={{
                            position: 'absolute', top: 5, right: 5,
                            background: 'rgba(0,0,0,0.7)', border: 'none', color: '#FFFFFF',
                            width: 24, height: 24, borderRadius: '50%', cursor: 'pointer', fontSize: 13,
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                          }}>×</button>
                      </>
                    ) : (
                      <>
                        <div style={{ fontSize: 28, color: '#555555', marginBottom: 4 }}>+</div>
                        <div style={{ fontSize: 10, color: '#555555', textAlign: 'center', padding: '0 4px' }}>{note}</div>
                      </>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {sizeRec && (
            <div className="card">
              <div style={{ fontWeight: 600, marginBottom: 16 }}>Size Recommendation</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 20 }}>
                <div style={{
                  width: 72, height: 72, borderRadius: '50%', background: PINK,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 28, fontWeight: 800, flexShrink: 0,
                }}>{sizeRec.rec}</div>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 18 }}>{sizeRec.rec}</div>
                  <div style={{ color: sizeRec.confColor, fontSize: 13, fontWeight: 600, marginTop: 2 }}>{sizeRec.confidence}</div>
                </div>
              </div>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                <thead>
                  <tr>
                    {['Measurement','Value','Size Vote'].map(h => (
                      <th key={h} style={{ textAlign: 'left', color: '#555555', fontWeight: 500, paddingBottom: 8, borderBottom: `1px solid ${BORDER}` }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {sizeRec.rows.map(r => (
                    <tr key={r.label}>
                      <td style={{ padding: '8px 0', color: '#888888' }}>{r.label}</td>
                      <td style={{ padding: '8px 0' }}>{r.value} cm</td>
                      <td style={{ padding: '8px 0' }}><Badge style={{ fontSize: 11 }}>{r.vote}</Badge></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{ color: '#888888', fontSize: 12, marginTop: 14 }}>{sizeRec.note}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Dashboard ──────────────────────────────────────────────────────────────────

function Dashboard({ initialTab }) {
  const [activeTab, setActiveTab] = useState(initialTab || 'tryon');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [profile, setProfile] = useLocalStorage('fitme_profile', { name:'', gender:'male', preferredSize:'M', height:'', chest:'', waist:'', hips:'', inseam:'', arm:'' });
  const [photos, setPhotos] = useLocalStorage('fitme_photos', { front: null, side: null, back: null });
  const [wardrobe, setWardrobe] = useLocalStorage('fitme_wardrobe', []);
  const [history, setHistory] = useLocalStorage('fitme_history', []);
  const [tryOnPrefill, setTryOnPrefill] = useState(null);

  function handleTryOn(item) {
    setTryOnPrefill({ name: item.name, brand: item.brand, imageUrl: item.imageUrl });
    setActiveTab('tryon');
    setSidebarOpen(false);
  }

  function navTo(tab) {
    setActiveTab(tab);
    setSidebarOpen(false);
  }

  const initials = profile && profile.name
    ? profile.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2)
    : 'ME';

  const navItems = [
    { id: 'tryon', label: 'Try On', icon: '✨' },
    { id: 'wardrobe', label: 'Wardrobe', icon: '👗' },
    { id: 'history', label: 'History', icon: '🕐' },
    { id: 'profile', label: 'Profile', icon: '📏' },
  ];

  function SidebarContent({ mobile }) {
    return (
      <div style={{
        width: mobile ? 240 : 220,
        background: '#111111',
        borderRight: `1px solid ${BORDER}`,
        display: 'flex',
        flexDirection: 'column',
        height: '100%',
        ...(mobile ? { position: 'fixed', top: 0, left: 0, bottom: 0, zIndex: 50 } : {}),
      }}>
        <div style={{ padding: '20px 16px 16px', borderBottom: `1px solid ${BORDER}` }}>
          <div style={{ fontWeight: 700, fontSize: 17 }}>✨ FIT-ME</div>
        </div>
        <nav style={{ flex: 1, padding: '12px 10px', overflowY: 'auto' }}>
          {navItems.map(item => (
            <div key={item.id}
              className={'sidebar-item' + (activeTab === item.id ? ' active' : '')}
              onClick={() => navTo(item.id)}>
              <span style={{ fontSize: 16 }}>{item.icon}</span>
              {item.label}
            </div>
          ))}
        </nav>
        <div style={{ padding: '14px 16px', borderTop: `1px solid ${BORDER}`, display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{
            width: 36, height: 36, borderRadius: '50%', background: PINK,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontWeight: 700, fontSize: 13, flexShrink: 0,
          }}>{initials}</div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontWeight: 600, fontSize: 13, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {(profile && profile.name) || 'My Account'}
            </div>
            <div style={{ color: PINK, fontSize: 11, fontWeight: 600 }}>Pro member</div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      {/* Desktop sidebar */}
      <div className="sidebar-desktop" style={{ flexShrink: 0 }}>
        <SidebarContent />
      </div>

      {/* Mobile overlay + sidebar */}
      {sidebarOpen && (
        <>
          <div className="overlay" onClick={() => setSidebarOpen(false)} />
          <SidebarContent mobile={true} />
        </>
      )}

      {/* Main content */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        {/* Mobile header */}
        <div className="mobile-header" style={{
          padding: '12px 16px', borderBottom: `1px solid ${BORDER}`,
          display: 'flex', alignItems: 'center', gap: 12, background: '#111111',
        }}>
          <button onClick={() => setSidebarOpen(true)} style={{
            background: 'none', border: 'none', color: '#FFFFFF', cursor: 'pointer',
            fontSize: 22, display: 'flex', alignItems: 'center', padding: 4,
          }}>☰</button>
          <div style={{ fontWeight: 700 }}>✨ FIT-ME</div>
        </div>

        <div style={{ flex: 1, overflowY: 'auto', padding: '28px 24px' }}>
          {activeTab === 'tryon' && (
            <TryOnTab
              profile={profile}
              photos={photos}
              setHistory={setHistory}
              prefill={tryOnPrefill}
              clearPrefill={() => setTryOnPrefill(null)}
              goToProfile={() => navTo('profile')}
            />
          )}
          {activeTab === 'wardrobe' && (
            <WardrobeTab wardrobe={wardrobe} setWardrobe={setWardrobe} onTryOn={handleTryOn} />
          )}
          {activeTab === 'history' && (
            <HistoryTab history={history} setHistory={setHistory} />
          )}
          {activeTab === 'profile' && (
            <ProfileTab profile={profile} setProfile={setProfile} photos={photos} setPhotos={setPhotos} />
          )}
        </div>
      </div>
    </div>
  );
}

// ── App Root ───────────────────────────────────────────────────────────────────

function App() {
  const [view, setView] = useState('landing');

  function goToApp() {
    setView('dashboard');
  }

  if (view === 'dashboard') return <Dashboard initialTab="tryon" />;
  return <Landing onGetStarted={goToApp} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
